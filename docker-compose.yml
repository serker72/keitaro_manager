services:
  postgres:
    image: postgres:16-alpine
    container_name: km_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT_HOST}:${POSTGRES_PORT}"
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: km_backend
    ports:
      - "${BACKEND_PORT_HOST}:8000"
    env_file:
      - .env
    volumes:
      - ${LOGS_DATA_DIR}:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: km_frontend
    ports:
      - "${FRONTEND_PORT_HOST}:3000"
    env_file:
      - .env
    depends_on:
      - backend
